<div class="flex items-center gap-2 h-8 px-2 bg-base-100 border border-base-content/30 rounded-full">
  <div
    role="button"
    tabindex="0"
    aria-label="sunny mode"
    class="group inline-flex justify-center items-center p-1 rounded-full cursor-pointer hover:bg-primary"
    :class="$store.darkMode.icon() === 'sunny' && 'bg-primary'"
    @click="$store.darkMode.toggle('n')"
  >
    <svg
      style="width: 18px; height: 18px"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      class="group-hover:text-primary-content"
      :class="$store.darkMode.icon() === 'sunny' && 'text-primary-content'"
    >
      <circle cx="12" cy="12" r="4.5" />
      <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
    </svg>
  </div>

  <div
    role="button"
    tabindex="0"
    aria-label="moon mode"
    class="group inline-flex justify-center items-center p-1 rounded-full cursor-pointer hover:bg-primary"
    :class="$store.darkMode.icon() === 'moon' && 'bg-primary'"
    @click="$store.darkMode.toggle('y')"
  >
    <svg
      style="width: 18px; height: 18px"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="group-hover:text-primary-content"
      :class="$store.darkMode.icon() === 'moon' && 'text-primary-content'"
    >
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    </svg>
  </div>

  <div
    role="button"
    tabindex="0"
    aria-label="auto mode"
    class="group inline-flex justify-center items-center p-1 rounded-full cursor-pointer hover:bg-primary"
    :class="$store.darkMode.icon() === 'desktop' && 'bg-primary'"
    @click="$store.darkMode.toggle('auto')"
  >
    <svg
      style="width: 18px; height: 18px"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="group-hover:text-primary-content"
      :class="$store.darkMode.icon() === 'desktop' && 'text-primary-content'"
    >
      <rect x="2" y="3" width="20" height="14" rx="2" />
      <path d="M8 21h8M12 17v4" />
    </svg>
  </div>
</div>

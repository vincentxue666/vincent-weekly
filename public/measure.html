<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>measure</title></head>
<body>
<div id="out"></div>
<iframe id="f" src="http://127.0.0.1:8787/posts/20260810/" width="1920" height="3000"></iframe>
<script>
function measure() {
  var f = document.getElementById('f');
  var d = f.contentDocument;
  var vw = f.contentWindow.innerWidth;
  var out = [];
  var els = {
    navContainer: d.querySelector('nav .container'),
    front: d.querySelector('.front'),
    mainContainer: d.querySelector('.container .container, .front > .container'),
    articleWrap: d.querySelector('.mx-auto'),
    article: d.querySelector('#dream-single-post-main'),
  };
  for (var k in els) {
    var el = els[k];
    if (!el) { out.push(k + ': NOT FOUND'); continue; }
    var r = el.getBoundingClientRect();
    var cs = f.contentWindow.getComputedStyle(el);
    out.push(k + ': x=' + Math.round(r.left) + ' w=' + Math.round(r.width) +
      ' | margin-left=' + cs.marginLeft + ' margin-right=' + cs.marginRight +
      ' | display=' + cs.display);
  }
  out.push('viewport width=' + vw);
  out.push('expected center=' + (vw/2));
  document.getElementById('out').textContent = out.join('\n');
}
document.getElementById('f').onload = function(){ setTimeout(measure, 500); };
</script>
</body>
</html>

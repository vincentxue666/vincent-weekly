<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>measure</title></head>
<body>
<div id="out"></div>
<iframe id="f" src="http://127.0.0.1:8787/" width="1280" height="3000"></iframe>
<script>
document.getElementById('f').onload = function(){
  setTimeout(function(){
    var d = document.getElementById('f').contentDocument;
    var cols = d.querySelectorAll('.dream-column .card');
    var out = [];
    cols.forEach(function(c,i){ var r=c.getBoundingClientRect(); out.push('card'+i+': h='+Math.round(r.height)+' top='+Math.round(r.top)); });
    var imgs = d.querySelectorAll('.dream-column .card figure img');
    imgs.forEach(function(im,i){ out.push('img'+i+': h='+Math.round(im.getBoundingClientRect().height)); });
    document.getElementById('out').textContent = out.join('\n');
  }, 800);
};
</script>
</body>
</html>

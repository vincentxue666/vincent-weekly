<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>measure</title></head>
<body>
<div id="out"></div>
<iframe id="f" width="1400" height="3000"></iframe>
<script>
var W = new URLSearchParams(location.search).get('w') || 1400;
document.getElementById('f').width = W;
document.getElementById('f').src = 'http://127.0.0.1:8787/';
document.getElementById('f').onload = function(){
  setTimeout(function(){
    var fw = document.getElementById('f').contentWindow;
    var d = fw.document;
    var out = ['viewport=' + fw.innerWidth];
    var cols = d.querySelectorAll('.dream-column .card');
    cols.forEach(function(c,i){
      var r = c.getBoundingClientRect();
      var cs = fw.getComputedStyle(c);
      out.push('card'+i+': x='+Math.round(r.left)+' w='+Math.round(r.width)+' h='+Math.round(r.height)+' | maxWidth='+cs.maxWidth);
    });
    document.getElementById('out').textContent = out.join('\n');
  }, 900);
};
</script>
</body>
</html>
